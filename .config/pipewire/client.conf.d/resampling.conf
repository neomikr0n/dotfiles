# Clientes nativos de PipeWire. Conserva la frecuencia solicitada por la aplicación.
# Calidad 10 de 14 (rango 0-14, por defecto 4, ver pipewire-props(7)).
# Iguala la ruta de clientes PulseAudio, que ya usa 10 en
# pipewire-pulse.conf.d/force-192k.conf. Con 10 el error de remuestreo queda por
# debajo del piso de ruido del RME (123 dBA): no es audible.
# Se elimina node.latency forzado a 192k para permitir conmutación nativa de reloj (44.1k/48k).
stream.properties = {
    resample.quality = 10
}
